# All tunable parameters live here; code reads them, never hard-codes them.
data:
  start_date: "2004-01-01"
  tickers:
    indices: ["^GSPC", "^VIX", "^IXIC", "^DJI"]
    etfs: ["SPY", "QQQ", "DIA", "TLT", "IEF", "SHY", "LQD", "HYG"]
    sectors: ["XLF", "XLK", "XLE", "XLV", "XLY", "XLP", "XLI", "XLU", "XLB"]
  fred_series: ["DFF", "DGS10", "DGS2", "T10Y2Y", "UNRATE", "CPIAUCSL"]

target:
  asset: "^GSPC"
  horizon_days: 5
  threshold_quantile: 0.80       # sensitivity: 0.90
  threshold_lookback_obs: 252
  trading_days_per_year: 252

validation:
  modeling_start: "2006-01-01"
  initial_train_end: "2012-12-31"
  test_years: [2013, 2023]        # inclusive range of yearly walk-forward folds
  final_holdout_start: "2024-01-01"
  embargo_days: 5

overlay:
  instrument: "SPY"
  primary_model: "random_forest"    # declared after the walk-forward results, before any overlay result
  secondary_model: "logit_tuned"
  target_vol: 0.10
  target_vol_sensitivity: [0.08, 0.10, 0.12]
  ewma_lambda: 0.94                 # RiskMetrics decay
  cost_bps_base: 5
  cost_bps_sensitivity: [0, 2, 5, 10]
  execution_lag_days: 2             # decided at close t, applied to the return of day t+2
  lag_sensitivity: [1, 2]
  max_weight: 1.0                   # no leverage
  episodes:
    covid_crash: ["2020-02-19", "2020-04-30"]
    year_2022: ["2022-01-01", "2022-12-31"]

dq:
  return_outlier_threshold: 0.15    # |log return| above this is flagged for review (not deleted)
  stale_run_length: 5               # identical consecutive closes that trigger a warning
  max_missing_fraction: 0.005       # missing trading days above this blocks the load
  max_non_trading_fraction: 0.001   # off-calendar rows up to this share are dropped and flagged; more blocks
  revision_tolerance: 1.0e-6        # relative change in stored close that counts as a vendor revision

stats:
  bootstrap_draws: 1000
  mean_block_length: 20             # stationary bootstrap; >= horizon because labels overlap
  dm_horizon: 5                     # HAC lag = horizon - 1
  seed: 12345

risk:
  portfolio: {SPY: 0.6, IEF: 0.4}   # daily-rebalanced; any weights work (Tier 2 can use more assets)
  confidence_levels: [0.95, 0.99]
  window: 500                       # historical and FHS residual window
  ewma_lambda: 0.94
  student_t_df: 5
  garch_min_fit_obs: 500            # FHS refits each January on returns through the prior December
  backtest_start: "2007-01-01"
  backtest_end: "2023-12-31"        # the 2024+ holdout is never touched
  mc_paths: 100000
  mc_horizon_days: 10
  stress:
    replays:
      gfc_2008: ["2008-09-02", "2008-11-20"]
      covid_2020: ["2020-02-19", "2020-03-23"]
      rates_2022: ["2022-01-03", "2022-10-12"]
    equity_shock: -0.20
    vol_multiplier: 2.0
    correlation_blend: 0.5
